server {






    listen 80;
    listen [::]:80;
    listen 5173;
    listen [::]:5173;
    server_name trbn.ru www.trbn.ru;
    location ^~ /.well-known/acme-challenge/ { root /var/www/trbn.ru/frontend; }
    # OAuth received over HTTP is not exchanged; remove query on HTTPS redirect.
    location ^~ /tiktok/ {
        access_log off;
        error_log /dev/null;
        return 308 https://trbn.ru$uri;
    }
    location / { return 301 https://$host$request_uri; }




}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name trbn.ru www.trbn.ru;
    ssl_certificate /etc/letsencrypt/live/trbn.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/trbn.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    root /var/www/trbn.ru/v2;
    add_header Cache-Control "no-cache" always;
    index index.html;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    gzip on; gzip_proxied any; gzip_comp_level 6; gzip_types text/plain text/css text/javascript application/javascript application/json application/xml image/svg+xml; gzip_min_length 1024; gzip_vary on; gzip_static on;
    location ~* ^/tweaks-panel\.jsx$ { deny all; return 404; }
    location ~* ^/docs(/|$) { deny all; return 404; }
    location = /AUDIT.md { deny all; return 404; }
    location = /api/v1/feed/stream { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /api/v1/ticker { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Connection ""; proxy_buffering off; proxy_cache off; proxy_read_timeout 1h; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    # Tribuna TikTok OAuth START
    # Inside the trbn.ru HTTPS server; all OAuth traffic bypasses the website/analytics.
    location ^~ /tiktok/ {
        access_log off;
        error_log /dev/null;
        client_max_body_size 4k;
        proxy_pass http://127.0.0.1:8083;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Original-URI "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        # Override inherited headers so callback data cannot leak in Referer.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    # Tribuna TikTok OAuth END

    # Tribuna advertising CRM START
    location = /crm/ads { return 308 /crm/ads/; }
    location ^~ /crm/ads/ {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        client_max_body_size 25m;
        proxy_connect_timeout 3s;
        proxy_read_timeout 45s;
        proxy_cache off;
        access_log off;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    location ^~ /v2/ad-media/ {
        alias /var/lib/tribuna-ads/public-media/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    # Tribuna advertising CRM END

    # ---- Admin panel → trbn-admin (:8081) ----
    location /admin/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16m;
    }

    location /api/ { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }
    location = /healthz { proxy_pass http://127.0.0.1:8080; }
    location /uploads/ { alias /var/www/trbn.ru/frontend/uploads/; expires 7d; add_header Cache-Control "public"; try_files $uri =404; }
    # Runtime data must stay fresh after CRM publication and match refresh.
    location = /initial-data.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /creatives.json { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /config.js { add_header Cache-Control "no-cache" always; try_files $uri =404; }
    location = /index.template.html { return 404; }
    location ~ /\. { return 404; }
    location ~* \.(py|pyc|sqlite3?|db|conf|bak|log|tmp|sha256|json)$ { return 404; }
    location ~* \.(jsx|jpg|jpeg|png|webp|avif|svg|gif|ico|css|js|woff2?|ttf|mp4|webm|pdf)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri @legacy_static;
    }
    location @legacy_static {
        root /var/www/trbn.ru/frontend;
        try_files $uri =404;
    }
    location ^~ /ad-media/ {
        alias /var/lib/tribuna-ads/public-media/;
        autoindex off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    }
    location = /sources.html { root /var/www/trbn.ru/frontend; try_files $uri =404; }
    # ---- MTS bookmaker landing (static) ----
    # Published magazine now lives at the domain root. Preserve bookmarks.
    location = /v2 { return 301 /$is_args$args; }
    location ^~ /v2/ { rewrite ^/v2/(.*)$ /$1 permanent; }
    # Direct visits to client-side routes use the magazine shell.
    location ~ ^/(archive|category|author|search|sitemap|matches|match|advertising|privacy|about)(/|$) {
        try_files $uri $uri/ /index.html;
    }

    location = /bonus { return 301 /bonus/; }
    location ^~ /bonus/ {
        root /var/www/trbn.ru;
        index index.html;
        try_files $uri $uri/ /bonus/index.html;
    }
    location / { try_files $uri $uri/ @legacy_site; }
    location @legacy_site { proxy_pass http://127.0.0.1:8080; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Real-IP $remote_addr; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; }


}
