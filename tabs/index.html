<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#1B1D19">
<title>Трибуна — внутренние вкладки, демо</title>
<style>
@font-face { font-family: Golos; src: url(fonts/golos-regular.ttf); font-weight: 400; font-display: swap; }
@font-face { font-family: Golos; src: url(fonts/golos-bold.ttf); font-weight: 700; font-display: swap; }
@font-face { font-family: Golos; src: url(fonts/golos-black.ttf); font-weight: 900; font-display: swap; }
:root { --ink: #1B1D19; --paper: #F2F3EE; --acid: #E6FF57; --muted: rgba(242,243,238,.6); --line: rgba(242,243,238,.12); }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: #11130F; color: var(--paper); font: 400 15px/1.45 Golos, system-ui, sans-serif; min-height: 100svh;
  padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 28px); }
.wrap { max-width: 560px; margin: 0 auto; }
.brand { display: flex; align-items: center; justify-content: space-between; }
.logo { background: var(--acid); color: var(--ink); font: 900 20px/1 Golos; letter-spacing: -.5px; padding: 9px 12px 8px; border-radius: 10px; }
.note { font-size: 12px; color: var(--muted); }
h1 { margin: 22px 0 6px; font: 900 clamp(28px, 8.4vw, 40px)/1.04 Golos; letter-spacing: -.035em; }
h1 span { color: var(--acid); }
.block { margin-top: 18px; background: var(--ink); border: 1px solid var(--line); border-radius: 24px; padding: 18px 0 8px; overflow: hidden; }
.block h2 { margin: 0 18px 4px; font: 900 22px/1.1 Golos; letter-spacing: -.02em; }
.block .sub { margin: 0 18px 6px; font-size: 12px; color: var(--muted); }

.tabs { position: relative; display: flex; gap: 4px; overflow-x: auto; padding: 0 12px 10px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; min-height: 44px; padding: 0 12px; border: 0; background: none; color: var(--muted); font: 700 1rem/1 Golos; cursor: pointer; white-space: nowrap;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation; transition: color .18s; border-radius: 10px; }
.tab[aria-selected="true"] { color: var(--paper); }
.tab:focus-visible { outline: 2px solid var(--acid); outline-offset: -2px; }
.streak { position: absolute; left: 0; bottom: 8px; height: 2px; border-radius: 2px; pointer-events: none; transform-origin: 0 50%; will-change: transform, width; }

.list { list-style: none; margin: 0; padding: 0 18px; min-height: 200px; }
.list li { padding: 12px 0; border-top: 1px solid var(--line); }
.list .k { font: 700 10px/1 Golos; letter-spacing: .12em; text-transform: uppercase; color: var(--acid); }
.list .t { margin: 5px 0 0; font-weight: 700; line-height: 1.25; }
.list .d { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
.list .none { color: var(--muted); padding: 30px 0; text-align: center; border-top: 1px solid var(--line); }
.count { margin: 0 18px 8px; font-size: 12px; color: var(--muted); }
.foot { margin-top: 20px; font-size: 12px; line-height: 1.5; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { .tab { transition: none; } }

/* One brand mark everywhere: the app logo as a file (assets/brand/tribuna-logo.svg). */
.logo { background: none !important; padding: 0 !important; border-radius: 0 !important; display: inline-block; line-height: 0; }
.logo { flex: none; } .logo img { display: block; height: 44px; width: auto; max-width: none; }
@media (max-width: 380px) { .logo img { height: 38px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo"><img src="tribuna-logo.svg" width="184" height="54" alt="Трибуна"></span><span class="note">Демо, без звука</span></div>
  <h1>Внутренние <span>вкладки</span></h1>

  <section class="block" aria-labelledby="hj">
    <h2 id="hj">Журнал</h2>
    <p class="sub" id="subj"></p>
    <div class="tabs" id="tabsJ" role="tablist" aria-label="Темы журнала"></div>
    <p class="count" id="countJ" aria-live="polite"></p>
    <ul class="list" id="listJ"></ul>
  </section>

  <section class="block" aria-labelledby="hm">
    <h2 id="hm">Матчи</h2>
    <p class="sub" id="subm"></p>
    <div class="tabs" id="tabsM" role="tablist" aria-label="День"></div>
    <p class="count" id="countM" aria-live="polite"></p>
    <ul class="list" id="listM"></ul>
  </section>

  <p class="foot" id="foot"></p>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';
  var D = window.TRIBUNA_TABS;
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  var LEAD = { k: 420, c: 30, m: 0.7 }, TRAIL = { k: 120, c: 20, m: 0.9 }; // the head darts, the tail catches up
  var SHORT = 26; // resting underline, px

  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function date(s) { if (!s) return ''; var m = s.split('-'); return m[2] + '.' + m[1] + '.' + m[0]; }

  function makeTabs(root, names, onChange) {
    var index = 0, raf = 0, last = 0, dir = 1;
    var A = { x: 0, v: 0, s: LEAD, t: 0 }, B = { x: 0, v: 0, s: LEAD, t: 0 };
    var streak = el('span', 'streak'); streak.setAttribute('aria-hidden', 'true');
    var tabs = names.map(function (n, i) {
      var b = el('button', 'tab', n); b.type = 'button'; b.setAttribute('role', 'tab');
      b.addEventListener('click', function () { select(i, true); });
      root.appendChild(b); return b;
    });
    root.appendChild(streak);
    root.addEventListener('keydown', function (e) {
      var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
      e.preventDefault(); var n = (index + d + names.length) % names.length; select(n, true); tabs[n].focus();
    });
    function rest(i) { var t = tabs[i], c = t.offsetLeft + t.offsetWidth / 2; return [c - SHORT / 2, c + SHORT / 2]; }
    function draw() {
      var a = Math.min(A.x, B.x), b = Math.max(A.x, B.x), w = Math.max(SHORT * 0.6, b - a);
      var g = Math.min(1, Math.max(0, (w - SHORT) / 70)); // glow follows the stretch, so it fades as the line contracts
      streak.style.width = w.toFixed(1) + 'px';
      streak.style.transform = 'translate3d(' + a.toFixed(1) + 'px,0,0)';
      streak.style.height = (2 + g).toFixed(2) + 'px';
      streak.style.background = g < 0.02 ? '#E6FF57'
        : 'linear-gradient(' + (dir > 0 ? '90deg' : '270deg') + ', rgba(230,255,87,' + (1 - g * 0.9).toFixed(2) + '), #E6FF57 62%, #FBFFE0)';
      streak.style.boxShadow = g < 0.02 ? 'none'
        : '0 0 ' + (6 + 12 * g).toFixed(1) + 'px rgba(230,255,87,' + (0.75 * g).toFixed(2) + '), 0 0 ' + (2 + 3 * g).toFixed(1) + 'px rgba(251,255,224,' + (0.9 * g).toFixed(2) + ')';
    }
    function step(o, dt) {
      var acc = (-o.s.k * (o.x - o.t) - o.s.c * o.v) / o.s.m; o.v += acc * dt; o.x += o.v * dt;
      return Math.abs(o.x - o.t) > 0.05 || Math.abs(o.v) > 0.5;
    }
    function tick(now) {
      var dt = Math.max(0, Math.min(0.064, (now - last) / 1000)); last = now; var moving = false;
      for (var n = Math.max(1, Math.ceil(dt / 0.004)), i = 0; i < n; i++) { var a = step(A, dt / n), b = step(B, dt / n); moving = a || b; }
      if (!moving) { A.x = A.t; B.x = B.t; A.v = B.v = 0; }
      draw(); raf = moving ? requestAnimationFrame(tick) : 0;
    }
    function snap() { var r = rest(index); A.x = A.t = r[0]; B.x = B.t = r[1]; A.v = B.v = 0; draw(); }
    function select(i, user) {
      var r = rest(i);
      if (i !== index) { dir = i > index ? 1 : -1; A.s = dir > 0 ? TRAIL : LEAD; B.s = dir > 0 ? LEAD : TRAIL; }
      index = i; A.t = r[0]; B.t = r[1];
      tabs.forEach(function (t, n) { t.setAttribute('aria-selected', n === i ? 'true' : 'false'); t.tabIndex = n === i ? 0 : -1; });
      if (user) {
        var t = tabs[i], want = t.offsetLeft - (root.clientWidth - t.offsetWidth) / 2;
        root.scrollTo({ left: Math.max(0, want), behavior: reduce.matches ? 'auto' : 'smooth' });
      }
      onChange(names[i]);
      if (reduce.matches) { snap(); return; }
      if (!raf) { last = performance.now(); raf = requestAnimationFrame(tick); }
    }
    window.addEventListener('resize', snap);
    // Labels change width when the font arrives or the text size changes: keep the line under its tab.
    function refit() { var r = rest(index); A.t = r[0]; B.t = r[1]; if (!raf) snap(); }
    if (window.ResizeObserver) { var ro = new ResizeObserver(refit); tabs.forEach(function (t) { ro.observe(t); }); }
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(refit);
    if (reduce.addEventListener) reduce.addEventListener('change', snap);
    select(0, false); snap();
    return { state: function () { return { index: index, a: A.x, b: B.x, ta: A.t, tb: B.t, moving: !!raf, glow: streak.style.boxShadow }; } };
  }

  /* ---------- Журнал ---------- */
  var FAVORITE = ['Теннис', 'Баскетбол']; // example of the reader's chosen topics
  var cats = []; D.articles.forEach(function (a) { if (a.category && cats.indexOf(a.category) < 0) cats.push(a.category); });
  var listJ = document.getElementById('listJ');
  var J = makeTabs(document.getElementById('tabsJ'), ['Главное', 'Для вас'].concat(cats), function (name) {
    var items = D.articles.filter(function (a) { return name === 'Главное' || (name === 'Для вас' ? FAVORITE.indexOf(a.category) >= 0 : a.category === name); });
    fill(listJ, document.getElementById('countJ'), items, function (a) {
      return [a.category, a.title, date(a.date) + (a.minutes ? ' · ' + a.minutes + ' мин' : '')];
    }, 'Статей: ');
  });
  document.getElementById('subj').textContent = '«Для вас» здесь — пример выбора тем: ' + FAVORITE.join(' и ') + '.';

  /* ---------- Матчи ---------- */
  var today = D.snapshotAt, tomorrow = new Date(new Date(today + 'T12:00:00Z').getTime() + 864e5).toISOString().slice(0, 10);
  var listM = document.getElementById('listM');
  var M = makeTabs(document.getElementById('tabsM'), ['Ближайшие', 'Сегодня', 'Завтра'], function (name) {
    var items = D.matches.filter(function (m) { return name === 'Ближайшие' || m.date === (name === 'Сегодня' ? today : tomorrow); });
    fill(listM, document.getElementById('countM'), items, function (m) {
      return [m.sport, m.home + ' — ' + m.away, date(m.date) + ', ' + m.time + ' · ' + m.league];
    }, 'Матчей: ');
  });
  document.getElementById('subm').textContent = '«Сегодня» и «Завтра» считаются от даты среза: ' + date(today) + '.';

  function fill(ul, count, items, row, word) {
    ul.textContent = '';
    count.textContent = word + items.length + (items.length > 8 ? ', показаны первые 8' : '');
    if (!items.length) { ul.appendChild(el('li', 'none', 'В срезе ничего нет.')); return; }
    items.slice(0, 8).forEach(function (it) {
      var r = row(it), li = el('li');
      li.appendChild(el('span', 'k', r[0])); li.appendChild(el('p', 't', r[1])); li.appendChild(el('p', 'd', r[2])); ul.appendChild(li);
    });
  }
  document.getElementById('foot').textContent = 'Подчёркивание вытягивается к новой вкладке световым следом, догоняет и сжимается; свечение гаснет вместе с ним. Звука и постоянного мерцания нет. Фильтры настоящие, данные — сохранённый срез от ' + date(D.snapshotAt) + ', он не обновляется.';
  window.__tabs = { J: J, M: M };
})();
</script>
</body>
</html>
