<!doctype html>
<html lang="ru" data-view="mobile" data-bg="flow">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#11130F">
<title>Трибуна — варианты фона</title>
<meta name="description" content="Галерея вариантов фона «Трибуны»: один и тот же экран, пять разных фонов. 18+">
<link rel="stylesheet" href="gallery.css">
<link rel="stylesheet" href="sample-mobile.css">
<link rel="stylesheet" href="sample-site.css">
</head>
<body>
<h1 class="g-sr">Трибуна — варианты фона</h1>

<!-- Фон: один холст на все варианты и вуаль, которая бережёт читаемость текста -->
<canvas class="bg-canvas" id="bg-canvas" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<!-- Образец «Мобильный экран»: экран «Рейтинг» приложения, собирается из ../data/app-data.json -->
<div class="sm" id="sample-mobile" inert>
  <div class="app">
    <header class="top">
      <span class="logo"><img src="tribuna-logo.svg" width="184" height="54" alt="Трибуна"></span>
      <div class="top-side">
        <span class="age">18+</span>
        <span class="round">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8.5" r="3.6"/><path d="M4.8 20c.9-3.6 3.7-5.4 7.200-5.400s6.300 1.800 7.200 5.400"/></svg>
        </span>
      </div>
    </header>
    <div class="view">
      <section class="screen screen-rating">
        <div class="lr" id="m-rating"></div>
      </section>
    </div>
    <div class="dock">
      <nav class="capsule" id="m-capsule" aria-label="Разделы">
        <svg class="wave" id="m-wave" height="64" aria-hidden="true">
          <defs><linearGradient id="waveGlow" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#E6FF57" stop-opacity=".2"/><stop offset="1" stop-color="#E6FF57" stop-opacity="0"/></linearGradient></defs>
          <path id="m-wave-glow" fill="url(#waveGlow)"/>
          <path id="m-wave-line" fill="none" stroke="#E6FF57" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </nav>
    </div>
  </div>
</div>

<!-- Образец «Сайт»: шапка, первый экран, матч-центр и карточки главной -->
<div class="ss" id="sample-site" inert hidden>
  <header class="top">
    <div class="top-in">
      <span class="logo"><img src="tribuna-logo.svg" width="184" height="54" alt="Трибуна"></span>
      <nav class="nav" aria-label="Разделы сайта">
        <span class="nav-all"><svg viewBox="0 0 16 16" aria-hidden="true"><rect x="1" y="1" width="5.5" height="5.5" rx="1"/><rect x="9.5" y="1" width="5.5" height="5.5" rx="1"/><rect x="1" y="9.5" width="5.5" height="5.5" rx="1"/><rect x="9.5" y="9.5" width="5.5" height="5.5" rx="1"/></svg>Все темы</span>
        <a>Футбол</a><a>Теннис</a><a>Баскетбол</a><a>Стиль</a><a>Истории</a>
        <a class="nav-bk">Рейтинг БК <sup>18+</sup></a>
      </nav>
      <div class="top-side">
        <span class="age">18+</span>
        <span class="round"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.4 15.4 5 5"/></svg></span>
        <span class="round menu-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></span>
      </div>
    </div>
  </header>
  <main id="s-main"></main>
</div>

<p class="g-fail" id="g-fail" role="alert" hidden>Не удалось загрузить данные образца. Откройте галерею через локальный сервер из папки dark-demos.</p>

<!-- Панель управления галереей -->
<aside class="gal" id="gal" aria-label="Варианты фона">
  <div class="gal-head">
    <button class="gal-ico" id="gal-prev" type="button" aria-label="Предыдущий вариант">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m14.500 6-6 6 6 6"/></svg></button>
    <p class="gal-now" aria-live="polite"><span id="gal-pos">1 / 5</span><b id="gal-title">Потоки</b></p>
    <button class="gal-ico" id="gal-next" type="button" aria-label="Следующий вариант">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9.500 6 6 6-6 6"/></svg></button>
    <button class="gal-ico gal-fold" id="gal-fold" type="button" aria-expanded="true" aria-controls="gal-body" aria-label="Свернуть панель">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9.500 6 6 6-6"/></svg></button>
  </div>
  <div class="gal-body" id="gal-body">
    <div class="gal-vars" id="gal-vars" role="group" aria-label="Фон"></div>
    <p class="gal-note" id="gal-note"></p>
    <div class="gal-row">
      <div class="gal-seg" role="group" aria-label="Образец">
        <button type="button" data-view="mobile" aria-pressed="true">Мобильный экран</button>
        <button type="button" data-view="site" aria-pressed="false">Сайт</button>
      </div>
      <button class="gal-pause" id="gal-pause" type="button" aria-pressed="false">Пауза</button>
    </div>
    <p class="gal-keys">← → — варианты, пробел — пауза</p>
  </div>
</aside>

<noscript><p class="g-fail">Галерее нужен JavaScript.</p></noscript>

<script src="bg/flow.js"></script>
<script src="bg/floodlights.js"></script>
<script src="bg/stands.js"></script>
<script src="bg/graphite.js"></script>
<script src="bg/planes.js"></script>
<script src="sample.js"></script>
<script src="gallery.js"></script>
</body>
</html>
